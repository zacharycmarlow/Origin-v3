kind = "web"
previewPath = "/"
title = "Origin App"
version = "1.0.0"
id = "artifacts/origin-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22798

[services.development]
run = "pnpm --filter @workspace/origin-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/origin-app", "run", "build" ]
publicDir = "artifacts/origin-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22798"
BASE_PATH = "/"
