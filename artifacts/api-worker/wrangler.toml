name = "origin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "origin-db"
database_id = "YOUR_D1_DATABASE_ID"

# R2 bucket binding for media storage
[[r2_buckets]]
binding = "R2"
bucket_name = "origin-media"

# AI Gateway for Anthropic (optional — routes AI through Cloudflare)
# [ai]
# binding = "AI"

# Environment variables (set via wrangler secret or dashboard)
# ANTHROPIC_API_KEY — set via `wrangler secret put ANTHROPIC_API_KEY`
# CLERK_SECRET_KEY — set via `wrangler secret put CLERK_SECRET_KEY`

[vars]
R2_BUCKET = "origin-media"
CORS_ALLOWED_ORIGINS = "https://origin.pages.dev,https://your-custom-domain.com"

# Observability
[observability]
enabled = true
