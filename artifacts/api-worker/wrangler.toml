name = "origin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Route the worker to /api/* on the custom domain.
# Cloudflare Pages serves the frontend; this worker handles API calls.
# NOTE: The zone templeearth.cc is on a different Cloudflare account.
# The worker is deployed to workers.dev and proxied via a Pages Function.
# To use a custom-domain route instead, ensure the zone is on the same
# account and uncomment the routes below.
# routes = [
#   { pattern = "mymetamyth.templeearth.cc/api/*", zone_name = "templeearth.cc" },
# ]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "origin-db"
database_id = "e0cca45d-30e1-41f5-b9ad-e94fe1a5c2c0"
migrations_dir = "../../lib/db/drizzle-d1"

# R2 bucket binding for media storage
[[r2_buckets]]
binding = "R2"
bucket_name = "origin-media"

# AI Gateway for Anthropic (optional — routes AI through Cloudflare)
# [ai]
# binding = "AI"

# Environment variables (set via wrangler secret or dashboard)
# ANTHROPIC_API_KEY — set via `wrangler secret put ANTHROPIC_API_KEY`
# PRIVY_APP_ID — set via `wrangler secret put PRIVY_APP_ID` (or in [vars] below)

[vars]
R2_BUCKET = "origin-media"
PRIVY_APP_ID = "cmtrpl49m00sq0clamltxzaof"
CORS_ALLOWED_ORIGINS = "https://mymetamyth.templeearth.cc,https://mymetamyth.pages.dev"

# Observability
[observability]
enabled = true
