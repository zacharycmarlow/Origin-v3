# Origin-v3 / MetaMyth — Local Development Stack
# Run the frontend, API worker, and MinIO (S3-compatible R2 stand-in) locally.
#
# Usage:
#   docker compose up -d
#   pnpm install
#   pnpm --filter @workspace/origin-app dev
#   pnpm --filter @workspace/api-worker dev
#
# MinIO console: http://localhost:9001 (login: minioadmin / minioadmin)

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio-data:
